run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - gocritic
    - gofmt
    - goimports
    - gosec
    - govet
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - nilerr
    - tparallel
    - wastedassign
    - errorlint
    - forbidigo
    - forcetypeassert
    - predeclared
    - tenv

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  exhaustive:
    default-signifies-exhaustive: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - opinionated
  goimports:
    local-prefixes: github.com/mission-control/mission-control
  gosec:
    excludes:
      - G104 # Duplicates errcheck
  govet:
    enable-all: true
    disable:
      - fieldalignment # Too noisy for early development
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: unnecessary-stmt
      - name: unreachable-code
      - name: unused-parameter
  forbidigo:
    forbid:
      - pattern: "fmt\\.Print.*"
        msg: "Use slog for logging instead of fmt.Print"
      - pattern: "log\\.Print.*"
        msg: "Use slog for structured logging"

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - forcetypeassert
        - gocritic
    - path: internal/ent/
      linters:
        - gocritic
        - revive
        - unused
        - govet
