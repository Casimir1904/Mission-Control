global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mission-control-api"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "mission-control-api"

  - job_name: "nats"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["nats:8222"]
        labels:
          service: "nats"
